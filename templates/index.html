<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hong Kong Events Calendar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">Hong Kong Events</p>
          <h1>Event Time</h1>
          <p class="sidebar-note">A shared calendar for nightlife, culture, food, sport, and business events.</p>
        </div>

        <div class="photo-stack" aria-hidden="true">
          <div class="photo-card photo-card-skyline"></div>
          <div class="photo-card photo-card-street"></div>
        </div>

        <div class="status-block">
          <span class="status-label">Current View</span>
          <strong id="viewRangeLabel">Loading...</strong>
          <span id="calendarStatus">Fetching events...</span>
        </div>

        <section class="filter-bar" aria-label="Event category filters">
          <span class="section-label">Event Types</span>
          <div id="categoryFilters" class="filters"></div>
        </section>

        <div class="sidebar-actions">
          <button id="scrapeButton" class="primary">Refresh Events</button>
        </div>
      </aside>

      <main class="calendar-panel">
        <div id="calendar"></div>
      </main>
    </div>

    <dialog id="eventDialog">
      <article class="dialog-card">
        <h2 id="eventTitle"></h2>
        <p id="eventMeta"></p>
        <p id="eventDescription"></p>
        <div class="links">
          <a id="mapLink" target="_blank" rel="noopener">Open Map</a>
          <a id="ticketLink" target="_blank" rel="noopener">Tickets / Registration</a>
          <a id="discountLink" target="_blank" rel="noopener">Discount Offer</a>
        </div>
        <button id="closeDialog" class="ghost">Close</button>
      </article>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
