name: Accessibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start local Flask app
        env:
          DATABASE_URL: sqlite:///events.db
          FLASK_ENV: production
          PORT: "5050"
          SCRAPE_INCLUDE_SAMPLE: "1"
        run: |
          python run.py > flask-a11y.log 2>&1 &
          echo "$!" > flask-a11y.pid
          curl --fail --show-error --silent --retry 20 --retry-delay 1 --retry-connrefused --max-time 10 \
            http://127.0.0.1:5050/ > /dev/null

      - name: Run pa11y
        run: |
          set +e
          npx --yes pa11y@9.1.1 http://127.0.0.1:5050/ \
            --level error \
            --threshold 0 \
            --runner htmlcs \
            --reporter json \
            > pa11y-results.json || PA11Y_EXIT=$?
          PA11Y_EXIT="${PA11Y_EXIT:-0}"
          cat pa11y-results.json
          node <<'NODE'
          const fs = require("fs");
          const ignoredCodes = new Set([
            "WCAG2AA.Principle1.Guideline1_3.1_3_1.F92,ARIA4",
          ]);
          let issues;
          try {
            issues = JSON.parse(fs.readFileSync("pa11y-results.json", "utf8"));
          } catch (error) {
            console.error("pa11y did not produce parseable JSON output.");
            process.exit(1);
          }
          const blocking = issues.filter((issue) => issue.type === "error" && !ignoredCodes.has(issue.code));
          const ignored = issues.length - blocking.length;
          console.log(`pa11y blocking errors: ${blocking.length}; ignored known issues: ${ignored}`);
          if (blocking.length > 0) {
            console.error(JSON.stringify(blocking, null, 2));
            process.exit(1);
          }
          NODE
          NODE_EXIT=$?
          if [ "$NODE_EXIT" -ne 0 ]; then
            exit "$NODE_EXIT"
          fi
          if [ "$PA11Y_EXIT" -ne 0 ]; then
            echo "pa11y exited with ${PA11Y_EXIT}, but all reported issues were known ignores."
          fi
          exit 0

      - name: Show Flask log on failure
        if: failure()
        run: cat flask-a11y.log || true
